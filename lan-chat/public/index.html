<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, system-ui, sans-serif;
      background: #f4f4f5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #18181b;
      color: white;
    }
    #status { font-size: 0.85rem; }
    #messages {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #messages li {
      align-self: flex-start;
      max-width: 80%;
      padding: 8px 12px;
      background: white;
      border-radius: 12px;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    #messages li.system {
      align-self: center;
      background: none;
      box-shadow: none;
      color: #71717a;
      font-size: 0.85rem;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #e4e4e7;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }
    button:disabled { background: #a1a1aa; }
  </style>
</head>
<body>
  <header>
    <strong>LAN Chat</strong>
    <span id="status">Connecting…</span>
  </header>

  <ul id="messages"></ul>

  <form id="chat-form">
    <input id="message-input" autocomplete="off" placeholder="Type a message…">
    <button id="send-button" disabled>Send</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
